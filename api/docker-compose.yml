services:
  postgres:
    image: postgres:16-alpine
    container_name: reservation-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: reservation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: reservation-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://root:root@postgres:5432/reservation?sslmode=disable
      JWT_SECRET: change-me-in-production
      APP_PUBLIC_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reservation.local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
